# Dashboard theme (UI v3): deep blue primary on a warm off-white page. Streamlit cannot switch themes per visitor, so this
# is the light base; the in-app Dark mode is drawn by src/dashboard/styles.css from the tokens in theme.py.
[theme]
base = "light"
primaryColor = "#1F4E8C"
backgroundColor = "#FBF7F0"
secondaryBackgroundColor = "#F3ECE0"
textColor = "#1C2230"
font = "sans serif"

[client]
toolbarMode = "viewer"
showErrorDetails = "none"

[browser]
gatherUsageStats = false
