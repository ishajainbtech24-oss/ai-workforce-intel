# Dashboard theme (UI v3): deep blue primary on a warm off-white page. Streamlit cannot switch themes per visitor, so this
# is the light base; the in-app Dark mode is drawn by src/dashboard/styles.css from the tokens in theme.py.
[theme]
base = "light"
primaryColor = "#1F4E8C"
backgroundColor = "#FBF7F0"
secondaryBackgroundColor = "#F3ECE0"
textColor = "#1C2230"
font = "sans serif"

[client]
toolbarMode = "viewer"
showErrorDetails = "none"

[browser]
gatherUsageStats = false

[server]
# No file watcher on the website: it only reloads code while someone edits files, and after every page run it re-checks
# the location of every loaded module (thousands, with the forecasting libraries), which froze the Welcome page and slowed
# the slow free host. Render restarts the app on each deploy, so new code still goes live. For live reloading while
# developing, run: streamlit run src/dashboard/app.py --server.fileWatcherType auto
fileWatcherType = "none"
