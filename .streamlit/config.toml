# Dashboard theme: deep blue primary on a warm off-white page (light) and ink navy (dark). The in-app Dark mode switch
# and the page styles come from src/dashboard/ui/styles.css, drawn from the same tokens in ui/theme.py.
[theme]
font = "sans serif"

# The same palette as src/dashboard/ui/theme.py (TOKENS). With both sections, Streamlit offers light and dark itself
# and starts from the visitor's system setting; the app's Dark mode switch follows it on the first visit.
[theme.light]
primaryColor = "#1F4E8C"
backgroundColor = "#FBF7F0"
secondaryBackgroundColor = "#F3ECE0"
textColor = "#1C2230"

[theme.dark]
primaryColor = "#8DB3EC"
backgroundColor = "#141A24"
secondaryBackgroundColor = "#1A2130"
textColor = "#F3EEE5"

[client]
toolbarMode = "viewer"
showErrorDetails = "none"

[browser]
gatherUsageStats = false

[server]
# No file watcher on the website: it only reloads code while someone edits files, and after every page run it re-checks
# the location of every loaded module (thousands, with the forecasting libraries), which froze the Welcome page and slowed
# the slow free host. Render restarts the app on each deploy, so new code still goes live. For live reloading while
# developing, run: streamlit run src/dashboard/app.py --server.fileWatcherType auto
fileWatcherType = "none"
